services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: erp
      MYSQL_USER: erp
      MYSQL_PASSWORD: erp_local
      MYSQL_ROOT_PASSWORD: root_local
    ports: ["3306:3306"]
    volumes: ["mysql_data:/var/lib/mysql"]
  redis:
    image: redis:7.4-alpine
    ports: ["6379:6379"]
  namesrv:
    image: apache/rocketmq:5.3.1
    command: sh mqnamesrv
    ports: ["9876:9876"]
  broker:
    image: apache/rocketmq:5.3.1
    command: sh mqbroker -n namesrv:9876
    environment:
      NAMESRV_ADDR: namesrv:9876
    depends_on: [namesrv]
    ports: ["10911:10911", "10909:10909"]
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: erp_local
      MINIO_ROOT_PASSWORD: erp_local_secret
    ports: ["9000:9000", "9001:9001"]
volumes:
  mysql_data: {}
